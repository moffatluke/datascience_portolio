project: 
  type: website

website:
  title: "Luke Moffat - Data Science Portfolio"
  favicon: Images/favicon.png
  back-to-top-navigation: true
  repo-url: https://github.com/moffatluke/datascience_portolio
  #repo-actions: [issue] #if you want to allow others to report issues on your site uncomment this line

  page-footer:
    border: true
    left: "Luke Moffat 2026©"
    right:
      - icon: globe
        href: https://moffatluke.com
      - icon: github
        href: https://github.com/moffatluke
      # TODO: add LinkedIn icon back once you have a URL
      # - icon: linkedin
      #   href: Your_LinkedIn_URL

  navbar:
    title: "Luke Moffat" # shorter than the full site title so it doesn't crowd the nav links
    background: primary
    search: true
    right:
      - text: "Home"
        file: index.qmd
      - text: "Resume"
        file: resume.qmd
      - text: "Projects"
        menu:
          - text: "Data Cleansing"
            file: cleansing.qmd
          - text: "Data Exploration"
            file: exploration.qmd
          - text: "Story Telling"
            file: story_telling.qmd
          - text: "Machine Learning"
            file: ml.qmd
          - text: "Full Stack"
            file: full_stack.qmd
          - text: "Competition"
            file: competition.qmd
  
format:
  html:
    theme: flatly # light base theme, close to moffatluke.com's near-white background — see styles.css for the emerald accent + font overrides
    css: styles.css
    toc: false # no "On this page" side nav — keeps pages clean like moffatluke.com
    mainfont: "Schibsted Grotesk"



